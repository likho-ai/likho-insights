name: ci

on:
  push:
    branches: [main, staging, development]
  pull_request:

jobs:
  ci:
    uses: likho-ai/likho-infra/.github/workflows/python-ci.yml@main
    with:
      stack-services: "mongo nats"

  publish:
    needs: ci
    if: github.event_name == 'push'      # development, staging or main: the branch's image
    uses: likho-ai/likho-infra/.github/workflows/docker-publish.yml@main
    permissions:
      contents: read
      packages: write
